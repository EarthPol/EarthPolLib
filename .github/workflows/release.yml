name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to retry (leave empty to release main)'
        required: false
        type: string

permissions:
  contents: write

# Queue main updates instead of replacing an already pending release.
concurrency:
  group: earthpollib-release
  queue: max
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      NEXUS_RELEASES_URL: https://nexus.tinydc.net/repository/maven-releases

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check publishing credentials
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          if [[ -z "$NEXUS_USERNAME" || -z "$NEXUS_PASSWORD" ]]; then
            echo 'NEXUS_USERNAME and NEXUS_PASSWORD must be available to this repository.' >&2
            exit 1
          fi

      - name: Resolve release version
        id: metadata
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: python3 .github/scripts/release_version.py "$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21 and Nexus credentials
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: nexus-releases
          server-username: NEXUS_USERNAME
          server-password: NEXUS_PASSWORD

      - name: Set artifact version and verify
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.22.0:set \
            "-DnewVersion=$RELEASE_VERSION" -DgenerateBackupPoms=false
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
          mvn -B -ntp clean verify
          cp dependency-reduced-pom.xml "target/earthpollib-$RELEASE_VERSION.pom"

      - name: Check for an earlier Nexus upload
        id: nexus
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          TAG_EXISTED: ${{ steps.metadata.outputs.tag_exists }}
        run: |
          base="$NEXUS_RELEASES_URL/com/earthpol/earthpollib/$RELEASE_VERSION/earthpollib-$RELEASE_VERSION"
          suffixes=(.jar -sources.jar -javadoc.jar .pom)
          found=0
          for suffix in "${suffixes[@]}"; do
            status="$(curl --silent --show-error --retry 3 --head --output /dev/null \
              --write-out '%{http_code}' "$base$suffix")"
            case "$status" in
              200) found=$((found + 1)) ;;
              404) ;;
              *) echo "Nexus returned HTTP $status for $base$suffix" >&2; exit 1 ;;
            esac
          done

          if [[ "$found" == 0 ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          elif [[ "$found" == 4 && "$TAG_EXISTED" == true ]]; then
            # Reuse the published bytes when retrying GitHub release creation.
            for suffix in "${suffixes[@]}"; do
              curl --fail --silent --show-error --retry 3 "$base$suffix" \
                --output "target/earthpollib-$RELEASE_VERSION$suffix"
            done
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          else
            echo 'Nexus has a partial upload or an unowned version; refusing to overwrite it.' >&2
            echo 'Resolve the conflicting Nexus version, then retry this tag.' >&2
            exit 1
          fi

      - name: Reserve version tag
        if: steps.metadata.outputs.tag_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.metadata.outputs.commit }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_COMMIT"

      - name: Publish verified artifacts to Nexus
        if: steps.nexus.outputs.deploy == 'true'
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          mvn -B -ntp org.apache.maven.plugins:maven-deploy-plugin:3.1.2:deploy-file \
            -DrepositoryId=nexus-releases "-Durl=$NEXUS_RELEASES_URL/" \
            "-Dfile=target/earthpollib-$RELEASE_VERSION.jar" \
            "-DpomFile=target/earthpollib-$RELEASE_VERSION.pom" \
            "-Dsources=target/earthpollib-$RELEASE_VERSION-sources.jar" \
            "-Djavadoc=target/earthpollib-$RELEASE_VERSION-javadoc.jar"

      - name: Generate artifact checksums
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        working-directory: target
        run: |
          sha256sum "earthpollib-$RELEASE_VERSION.jar" \
            "earthpollib-$RELEASE_VERSION-sources.jar" \
            "earthpollib-$RELEASE_VERSION-javadoc.jar" \
            "earthpollib-$RELEASE_VERSION.pom" > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: EarthPolLib ${{ steps.metadata.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            target/earthpollib-${{ steps.metadata.outputs.version }}.jar
            target/earthpollib-${{ steps.metadata.outputs.version }}-sources.jar
            target/earthpollib-${{ steps.metadata.outputs.version }}-javadoc.jar
            target/earthpollib-${{ steps.metadata.outputs.version }}.pom
            target/SHA256SUMS

      - name: Summarize publication
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          echo "Released com.earthpol:earthpollib:$RELEASE_VERSION to Bitworks Nexus." >> "$GITHUB_STEP_SUMMARY"
          echo "GitHub: https://github.com/$GITHUB_REPOSITORY/releases/tag/v$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
